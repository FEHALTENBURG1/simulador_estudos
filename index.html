<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Desenho de Estudo</title>
<meta name="description" content="Treino de epidemiologia para a gestão da atenção primária: distribua a verba de pesquisa de um território, escolha a pergunta e o desenho de cada estudo e veja o que ele teria encontrado.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101819">
<style>
:root {
  color-scheme: dark;
  --bg: #101819; --surface: #172122; --surface-2: #1f2c2d; --ink: #e6eeee; --muted: #a3b4b5; --line: #31433f;
  --teal: #6cc4c9; --teal-soft: #17383b;
  --amber: #e3a95c; --amber-soft: #3a2c14; --amber-bar: #d9983f;
  --red: #f0908a; --red-soft: #3d1f1d; --red-bar: #d9655d;
  --green: #86cf94; --green-soft: #1b3322; --green-bar: #5fb375;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
/* Impressão em fundo claro, para gastar menos tinta */
@media print {
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --surface-2: #efe9da; --ink: #1c2b2c; --muted: #55656a; --line: #d9d2bf;
    --teal: #0d5c63; --teal-soft: #d9ecea;
    --amber: #8a4b00; --amber-soft: #f6e3c4; --amber-bar: #c77a12;
    --red: #9d312a; --red-soft: #f4d9d5; --red-bar: #b9443b;
    --green: #2a6439; --green-soft: #d9ecdc; --green-bar: #3d8a52;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
body.planner { padding-bottom: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(1.7rem, 4.2vw, 2.4rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 .9em; }
ul, ol { margin: 0 0 .9em; padding-left: 1.2em; }
a { color: var(--teal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.pular { position: absolute; left: -999px; top: 0; background: var(--teal); color: var(--surface); padding: 8px 12px; z-index: 50; }
.pular:focus { left: 8px; top: 8px; }
#app:focus { outline: none; }

.container { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }
.topo { border-bottom: 1px solid var(--line); background: var(--surface); }
.topo .in { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.marca { font-family: var(--serif); font-weight: 600; letter-spacing: .01em; }
.marca small { font-family: var(--sans); font-weight: 400; color: var(--muted); margin-left: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--teal); background: transparent; color: var(--teal); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:hover { background: var(--teal-soft); }
.btn.primario { background: var(--teal); color: var(--surface); }
.btn.primario:hover { filter: brightness(1.08); background: var(--teal); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.texto { border-color: transparent; padding: 6px 8px; font-weight: 500; }
.btn.pequeno { padding: 5px 10px; font-size: .9rem; }
.voltar { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--teal); cursor: pointer; padding: 6px 0; font-weight: 600; text-decoration: none; }

.sobrescrito { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: .4em; }
.muted { color: var(--muted); }

/* Início */
.hero { padding: 40px 0 8px; max-width: 760px; }
.hero p.lead { font-size: 1.1rem; }
.passos { list-style: none; padding: 0; margin: 22px 0 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: p; }
.passos li { counter-increment: p; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; font-size: .95rem; }
.passos li::before { content: counter(p); position: absolute; left: -7px; top: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: .78rem; }
.ic-passo, .ic-caixa { flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
.ic-passo .ic, .ic-caixa .ic { width: 1.45rem; height: 1.45rem; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.cartao { display: flex; color: var(--ink); text-decoration: none; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; cursor: pointer; transition: border-color .15s, transform .15s; width: 100%; }
.cartao:hover { border-color: var(--teal); transform: translateY(-2px); }
.cartao h3 { margin: 0; font-size: 1.2rem; color: var(--teal); }
.cartao p { margin: 0; color: var(--muted); font-size: .96rem; }
.cartao .topo-cartao { display: flex; justify-content: space-between; align-items: center; font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pontos { letter-spacing: 3px; color: var(--teal); }
.fichas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
.ficha { font-size: .82rem; border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 2px 10px; color: var(--ink); }
.ficha.destaque { background: var(--green-soft); border-color: transparent; color: var(--green); font-weight: 600; }
details.glossario { margin-top: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; }
details.glossario summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
details.glossario dt { font-weight: 600; margin-top: 12px; }
details.glossario dd { margin: 2px 0 0; color: var(--muted); }
.rodape { margin-top: 34px; font-size: .9rem; color: var(--muted); max-width: 760px; }

/* Planejamento */
.cab { padding: 26px 0 8px; max-width: 800px; }
.pergunta { border-left: 4px solid var(--teal); background: var(--teal-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 18px 0; }
.pergunta .sobrescrito { margin-bottom: 2px; color: var(--teal); }
.pergunta p { margin: 0; font-family: var(--serif); font-size: 1.15rem; }
.regras { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.regras li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .94rem; }
.regras b { font-weight: 600; }
details.dicas { background: var(--amber-soft); border-radius: 10px; padding: 4px 16px; max-width: 800px; margin-bottom: 8px; color: var(--ink); }
details.dicas summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--amber); }
.plano-grade { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; margin-top: 18px; }
.passo { margin-bottom: 34px; }
.passo > h2 { display: flex; align-items: flex-start; gap: 12px; }
.passo > h2 .num { flex: none; width: 30px; height: 30px; margin-top: -1px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; font: 700 .9rem/1 var(--sans); }
.passo > h2 .tit { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.passo-ic { color: var(--teal); width: 1.25em; height: 1.25em; }
.passo > p.ajuda { color: var(--muted); margin-top: -.2em; }
.lista { display: grid; gap: 10px; }
.opcao { display: block; position: relative; cursor: pointer; }
.opcao input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.opcao .corpo { display: block; position: relative; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 13px 16px 13px 48px; transition: border-color .15s, background .15s; }
.opcao .corpo::before { content: ""; position: absolute; left: 16px; top: 16px; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; }
.opcao.marca-caixa .corpo::before { border-radius: 4px; }
.opcao input:checked + .corpo { border-color: var(--teal); background: var(--teal-soft); }
.opcao input:checked + .corpo::before { border-color: var(--teal); background: radial-gradient(circle, var(--teal) 0 42%, transparent 46%); }
.opcao.marca-caixa input:checked + .corpo::before { background: var(--teal); }
.opcao.marca-caixa input:checked + .corpo::after { content: ""; position: absolute; left: 22px; top: 19px; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.opcao input:focus-visible + .corpo { outline: 3px solid var(--teal); outline-offset: 2px; }
.opcao .nome { display: block; font-weight: 600; }
.item { position: relative; }
.item .corpo { padding-right: 56px; }
.saber { position: absolute; top: 10px; right: 12px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--surface); color: var(--muted); font: 700 .9rem/1 var(--sans); cursor: pointer; display: grid; place-items: center; padding: 0; }
.saber:hover, .saber.aberto { border-color: var(--teal); color: var(--teal); }
.saber.aberto { background: var(--teal-soft); }
.saber:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.saiba { margin: 6px 0 0; padding: 10px 14px; background: var(--surface-2); border-radius: 8px; font-size: .93rem; color: var(--ink); }
.saiba[hidden] { display: none; }
.passo > p.proximo { font-style: italic; }
.pc { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .88rem; }
.pc span { display: inline-flex; gap: 6px; }
.pc .mais::before { content: "+"; color: var(--green); font-weight: 700; }
.pc .menos::before { content: "−"; color: var(--red); font-weight: 700; }
.opcao .tags { display: block; margin-top: 2px; font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sub-grupo { margin: 18px 0 8px; font-weight: 600; font-size: .96rem; }
.unica { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 16px; }
.controle { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.controle label { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; margin-bottom: 8px; flex-wrap: wrap; }
.controle output { font-variant-numeric: tabular-nums; color: var(--teal); }
.controle.indef output { color: var(--muted); font-weight: 400; font-style: italic; }
.controle.indef input[type="range"] { accent-color: var(--muted); opacity: .75; }
input[type="range"] { width: 100%; accent-color: var(--teal); height: 28px; margin: 0; }
@media (pointer: coarse) { input[type="range"] { height: 38px; } }
.escala { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.derivado { font-size: .94rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
.derivado p { margin: 0 0 4px; }
.derivado p:last-child { margin: 0; }

.painel { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.painel h2 { font-size: 1.15rem; margin-bottom: .7em; }
.medidor { margin-bottom: 14px; }
.medidor .linha { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; margin-bottom: 4px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.medidor .linha b { font-weight: 600; }
.barra { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.barra > i { display: block; height: 100%; width: 0; background: var(--green-bar); transition: width .25s, background .25s; }
.barra.aviso > i { background: var(--amber-bar); }
.barra.estouro > i { background: var(--red-bar); }
.status { font-size: .92rem; padding: 8px 12px; border-radius: 8px; margin: 0 0 12px; background: var(--surface-2); color: var(--ink); }
.status.ok { background: var(--green-soft); color: var(--green); }
.status.ruim { background: var(--red-soft); color: var(--red); }
.painel .btn { width: 100%; }
.painel details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.painel summary { cursor: pointer; font-weight: 600; font-size: .94rem; padding: 4px 0; }
table.fino { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
table.fino td, table.fino th { padding: 5px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.fino td:last-child, table.fino th:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
table.fino tr.total td { font-weight: 700; border-bottom: 0; }
.painel .reiniciar { margin-top: 6px; }

/* Resultado */
.res-cab { padding: 26px 0 6px; }
.placar { display: flex; gap: 28px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; margin: 16px 0 22px; flex-wrap: wrap; }
.anel { position: relative; width: 140px; height: 140px; flex: none; }
.anel svg { display: block; }
.anel .nota { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--serif); font-size: 2.6rem; line-height: 1; font-weight: 600; }
.anel .nota small { display: block; font-family: var(--sans); font-size: .78rem; font-weight: 400; color: var(--muted); margin-top: 4px; }
.placar .texto { flex: 1 1 300px; }
.placar .veredito { font-family: var(--serif); font-size: 1.5rem; margin-bottom: .2em; }
.dimensoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 12px; margin-bottom: 30px; }
.dim { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.dim .linha { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
.dim p { margin: 8px 0 0; font-size: .88rem; color: var(--muted); }
.secao { margin-bottom: 34px; }
.secao > h2 { margin-bottom: .3em; }
.cartao-solto { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.grafico { width: 100%; height: auto; display: block; }
.grafico text { font-family: var(--sans); font-size: 12px; fill: var(--muted); }
.grafico .forte { fill: var(--ink); font-weight: 600; }
.g-faixa { fill: var(--teal-soft); }
.g-verdade { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; }
.g-ic { stroke: var(--teal); stroke-width: 3; fill: none; }
.g-pt { fill: var(--teal); }
.g-barra { fill: var(--teal); opacity: .6; }
.g-media { stroke: var(--amber-bar); stroke-width: 2.5; }
.g-eixo { stroke: var(--line); stroke-width: 1.5; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .86rem; color: var(--muted); margin-top: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.metrica { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.metrica b { display: block; font-family: var(--serif); font-size: 1.7rem; line-height: 1.1; }
.metrica span { font-size: .86rem; color: var(--muted); }
.achado { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.achado:first-child { border-top: 0; }
.achado h3 { font-family: var(--sans); font-size: 1rem; font-weight: 600; margin: 0 0 2px; }
.achado p { margin: 0; color: var(--ink); font-size: .96rem; }
.icone { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; margin-top: 1px; }
.ok .icone { background: var(--green-soft); color: var(--green); }
.alerta .icone { background: var(--amber-soft); color: var(--amber); }
.erro .icone { background: var(--red-soft); color: var(--red); }
.dupla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.dupla > * { min-width: 0; }
table.fino.plano td:first-child { width: 38%; color: var(--muted); padding-right: 10px; }
table.fino.plano td:last-child { text-align: left; white-space: normal; padding-left: 0; }
table.cheia { width: 100%; border-collapse: collapse; font-size: .94rem; font-variant-numeric: tabular-nums; }
table.cheia th, table.cheia td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.cheia th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
table.cheia td.num, table.cheia th.num { text-align: right; white-space: nowrap; }
.tabela-rolagem { overflow-x: auto; }
details.ref { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px 14px; }
details.ref summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
details.ref:not([open]) { padding-bottom: 2px; }
details.ref > summary { list-style: none; }
details.ref > summary::-webkit-details-marker { display: none; }
details.ref > summary::after { content: ""; margin-left: auto; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s; }
details.ref[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
details.ref dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: .94rem; }
details.ref dt { color: var(--muted); }
details.ref dd { margin: 0; }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 6px; }
.discussao li { margin-bottom: 8px; }
.aviso-sorteio { font-size: .9rem; color: var(--muted); }
#aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; font-size: .94rem; }
#aviso.visivel { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .plano-grade { grid-template-columns: 1fr; gap: 0; }
  body.planner { padding-bottom: 110px; }
  .painel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; border-radius: 14px 14px 0 0; border-width: 1px 0 0; padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px)); max-height: 74vh; overflow: auto; z-index: 30; box-shadow: 0 -6px 18px rgba(0, 0, 0, .4);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; align-items: center; }
  .painel > * { grid-column: 1 / -1; order: 2; }
  .painel h2 { display: none; }
  .painel > .painel-barra { display: flex; grid-column: 1; order: 0; }
  #btn-exec .longo { display: none; }
  #btn-exec .curto { display: inline; }
  .painel > #btn-exec { grid-column: 2; order: 1; width: auto; margin: 0; white-space: nowrap; padding: 11px 16px; }
  .painel > .relogio, .painel > .medidores, .painel > .status, .painel > details, .painel > .reiniciar { display: none; }
  .painel.aberto > .relogio { display: grid; margin-top: 8px; }
  .painel.aberto > .medidores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  .painel.aberto > .status { display: block; margin-bottom: 8px; padding: 6px 10px; }
  .painel.aberto > details:not([hidden]) { display: block; margin-top: 8px; }
  .painel.aberto > .reiniciar { display: inline-flex; width: 100%; }
  .relogio { padding: 0 0 8px; margin-bottom: 8px; }
  .relogio .rl-corpo small { display: none; }
  .relogio .rl-corpo b { font-size: 1rem; }
  .rl-ic { width: 28px; height: 28px; }
  .medidor { margin-bottom: 8px; }
}
.btn .curto { display: none; }
.painel-barra { display: none; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; min-height: 48px; padding: 4px 0; border: 0; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.pb-txt { display: flex; flex-direction: column; min-width: 0; font-size: .86rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.pb-txt .pb-1, .pb-txt .pb-2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-txt .pb-2 { color: var(--muted); font-size: .8rem; }
.pb-txt b { font-weight: 700; }
.pb-txt b.estouro { color: var(--red); }
.pb-seta { flex: none; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-135deg) translate(-2px, -2px); transition: transform .15s; margin-right: 4px; }
.painel.aberto .pb-seta { transform: rotate(45deg) translate(-2px, -2px); }
@media (max-width: 560px) {
  .hero h1, .cab h1 { font-size: 1.6rem; }
  .passo > h2 { gap: 10px; }
  .passo > h2 .tit { display: block; }
  .passo > h2 .passo-ic { display: inline-block; vertical-align: -.2em; margin-right: 6px; }
  .passo > h2 small { display: block; margin: 2px 0 0; }
  .container { padding: 0 16px 72px; }
  .placar { padding: 18px; }
  .anel { margin: 0 auto; }
  details.ref dl { grid-template-columns: 1fr; }
  .cartao { padding: 16px; }
  .oculta-m { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .topo, .painel, .acoes, .voltar { display: none !important; }
  body { background: #fff; }
}

/* Resultado: escolhas e implicações */
.escolha { padding: 12px 0; border-bottom: 1px solid var(--line); }
.escolha:last-child { border-bottom: 0; }
.escolha .rot { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.escolha h3 { margin: 2px 0 4px; font-size: 1.05rem; }
.escolha p { margin: 0 0 4px; }
.escolha ul { margin: 4px 0 0; padding-left: 18px; }
.escolha li { margin-bottom: 4px; }
details.leia { margin: 10px 0; }
details.leia > summary { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 4px 0; font-weight: 600; font-size: .94rem; color: var(--teal); list-style: none; }
details.leia > summary::-webkit-details-marker { display: none; }
details.leia > summary::before { content: ""; flex: none; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details.leia[open] > summary::before { transform: rotate(45deg); }
details.leia > summary:hover { text-decoration: underline; }
.leia-corpo { margin-top: 8px; }
.leia-corpo > :first-child { margin-top: 0; }
.leia-corpo > p.ajuda { margin-bottom: 0; }
.problema details.leia { margin: 6px 0 10px; }
details.mini { margin-top: 8px; }
details.mini summary { cursor: pointer; font-weight: 600; font-size: .94rem; color: var(--teal); }
details.ref .escolha:first-of-type { padding-top: 4px; }

/* Narrativa e jogo */
.tema { color: var(--muted); font-size: .95rem; margin: -.4em 0 1em; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; font: 700 1.1rem/1 var(--serif); }
.recado { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 18px; max-width: 800px; }
.recado blockquote { margin: 0; }
.recado blockquote p { margin: 0 0 6px; font-family: var(--serif); font-size: 1.08rem; }
.recado figcaption { font-size: .88rem; color: var(--muted); }
.passo > h2 small { font: 400 .88rem/1.3 var(--sans); color: var(--muted); margin-left: 4px; }
.elenco { margin: 8px 0 30px; }
.elenco h2 { font-size: 1.1rem; margin-bottom: 10px; }
.elenco ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.elenco li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: .94rem; }
.titulo-grade { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 12px; }
.titulo-grade h2 { margin: 0; }
.progresso { margin: 0; font-size: .9rem; color: var(--muted); }
.estrelas { margin: 0 0 2px; font-size: 1.15rem; letter-spacing: 3px; color: var(--amber-bar); }
.placar .prox { margin: 0 0 6px; }
.desfecho { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 0 12px 12px 0; padding: 14px 18px; margin: 16px 0 6px; max-width: 800px; }
.desfecho .sobrescrito { color: var(--teal); margin-bottom: 4px; }
.desfecho p:last-child { margin: 0; font-family: var(--serif); font-size: 1.08rem; }
.medalhas { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.medalha { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.medalha .selo { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 1.05rem; }
.medalha p { margin: 0; }
.medalha .nm { font-weight: 600; }
.medalha .ds { font-size: .86rem; color: var(--muted); }
.medalha .rot { display: block; font-weight: 400; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.medalha.nova { border-color: var(--amber-bar); background: var(--amber-soft); }
.medalha.nova .selo { background: var(--amber-bar); color: var(--surface); }
.medalha.nova .rot { color: var(--amber); font-weight: 700; }
.medalha.agora .selo, .medalha.antiga .selo { background: var(--teal-soft); color: var(--teal); }
.medalha.trancada { opacity: .7; }


/* Ícones */
.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.sobrescrito .ic { vertical-align: -.25em; margin-right: 2px; }
.marca { display: inline-flex; align-items: center; gap: 8px; }
.marca .ic { color: var(--teal); }
.ficha .ic { width: 1em; height: 1em; vertical-align: -.15em; margin-right: 3px; }
.icone .ic { width: 16px; height: 16px; vertical-align: 0; }
.medalha .selo .ic { width: 20px; height: 20px; vertical-align: 0; }
.dim .linha span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.dim .linha .ic { color: var(--teal); }
.regras li { display: inline-flex; align-items: center; gap: 6px; }
.regras .ic { color: var(--teal); }
details.dicas summary { display: flex; align-items: center; gap: 8px; }
details.glossario summary, details.ref summary { display: flex; align-items: center; gap: 8px; }
.secao > h2 .ic { color: var(--teal); vertical-align: -.15em; }
.btn .ic { width: 1.1em; height: 1.1em; vertical-align: 0; }
.ajuda { color: var(--muted); }
.icone-prob { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
.icone-prob .ic { width: 1.5rem; height: 1.5rem; vertical-align: 0; }
.icone-prob.mini { display: inline-grid; width: 24px; height: 24px; vertical-align: middle; margin-right: 4px; }
.icone-prob.mini .ic { width: 14px; height: 14px; margin: 0; }

/* Retrato do território */
.retrato { margin: 4px 0 28px; }
.retrato h2 { font-size: 1.1rem; margin-bottom: 10px; }
.retrato ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.retrato li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.retrato li b { display: block; font-family: var(--serif); font-size: 1.35rem; line-height: 1.1; }
.retrato li span:not(.ic-caixa) { font-size: .88rem; color: var(--muted); line-height: 1.3; display: block; }
.rodape-mini { margin: 8px 0 0; font-size: .82rem; color: var(--muted); }

/* Mesa de prioridades */
.verba-bar { position: sticky; top: 8px; z-index: 20; display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1.5px solid var(--teal); border-radius: 12px; padding: 10px 16px; margin: 0 0 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
.verba-ic { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; }
.verba-ic .ic { width: 1.4rem; height: 1.4rem; vertical-align: 0; }
.verba-corpo { flex: 1; min-width: 0; }
.verba-corpo .medidor, .verba-corpo > .linha { margin-bottom: 0; }
.verba-corpo .linha { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; margin-bottom: 4px; flex-wrap: wrap; }
.verba-livre { margin: 4px 0 0; font-size: .86rem; }
.problemas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 16px; }
.problema { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; transition: border-color .15s, box-shadow .15s; }
.problema.financiado { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.problema.feito { border-color: var(--green-bar); }
.problema header { display: flex; gap: 12px; align-items: center; }
.problema header > div { flex: 1; min-width: 0; }
.problema header h3 { margin: 0; font-size: 1.15rem; color: var(--teal); }
.problema header .sobrescrito { margin: 0 0 2px; font-size: .74rem; }
.problema p { margin: 0; font-size: .95rem; }
.problema .tema { font-weight: 600; color: var(--ink); margin: 0; }
.problema .fichas { margin-top: auto; padding-top: 0; }
.fatos { margin: 0 0 6px; display: grid; gap: 8px; }
.fatos > div { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
.fatos dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fatos dt .ic { color: var(--teal); }
.fatos dd { margin: 2px 0 0; font-size: .93rem; }
.problema .controle { margin: 4px 0 0; }
.problema .controle output { font-weight: 700; font-size: 1.05rem; }
.acoes-prob { display: flex; gap: 8px; flex-wrap: wrap; min-height: 0; }
.acoes-prob:empty { display: none; }
.acoes-prob [hidden] { display: none; }
.encerrar { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1.5px dashed var(--teal); border-radius: 14px; padding: 18px 22px; margin: 30px 0 12px; }
.encerrar > div { flex: 1 1 360px; }
.encerrar h2 { margin-bottom: .2em; display: flex; align-items: center; gap: 8px; }
.encerrar h2 .ic { color: var(--teal); }
.encerrar p { margin: 0; }

/* Relatório da temporada */
.relatorio { margin: 28px 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.anel-valor { flex: none; width: 140px; height: 140px; border-radius: 50%; border: 10px solid var(--teal); display: grid; place-content: center; text-align: center; }
.anel-valor b { font-family: var(--serif); font-size: 2.6rem; line-height: 1; font-weight: 600; }
.anel-valor small { font-size: .76rem; color: var(--muted); }
.rel-lista { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
.rel-linha { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.rel-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.rel-ic .ic { width: 1.4rem; height: 1.4rem; vertical-align: 0; }
.rel-linha.ok .rel-ic { background: var(--green-soft); color: var(--green); }
.rel-linha.alerta .rel-ic { background: var(--amber-soft); color: var(--amber); }
.rel-linha.erro .rel-ic { background: var(--red-soft); color: var(--red); }
.rel-corpo h3 { font-size: 1.02rem; margin: 0 0 2px; }
.rel-corpo p { margin: 0; font-size: .92rem; color: var(--muted); }
.rel-corpo .rot { display: inline-block; font: 600 .72rem/1 var(--sans); text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); vertical-align: middle; margin-left: 4px; }
.rel-linha.ok .rot { background: var(--green-soft); color: var(--green); }
.rel-linha.alerta .rot { background: var(--amber-soft); color: var(--amber); }
.rel-linha.erro .rot { background: var(--red-soft); color: var(--red); }
.rel-valor { text-align: right; font-variant-numeric: tabular-nums; }
.rel-valor b { display: block; font-family: var(--serif); font-size: 1.6rem; line-height: 1; }
.rel-valor small { color: var(--muted); font-size: .76rem; }
.relatorio .cartao-solto { margin-bottom: 16px; }

/* Consultorias */
.consultas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 12px; align-items: start; }
.consulta { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.consulta header { display: flex; gap: 12px; align-items: center; }
.consulta header h3 { margin: 0; font-size: 1.02rem; }
.consulta header p { margin: 0; font-size: .86rem; }
.consulta > p { margin: 0; font-size: .93rem; }
.consulta.pendente { border-color: var(--amber-bar); background: var(--amber-soft); }
.consulta.pronta { border-color: var(--green-bar); }
.espera p { margin: 0 0 8px; display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; }
.espera p .ic { margin-top: 3px; }
.espera .barra { margin-bottom: 10px; }
.espera .barra > i { background: var(--amber-bar); }
.resposta { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
.resposta p { margin: 0 0 8px; }
.resposta ul { margin: 0 0 8px; padding-left: 18px; }
.resposta .rot { display: flex; gap: 6px; align-items: flex-start; font-weight: 600; color: var(--green); font-size: .86rem; }
.resposta .rot .ic { margin-top: 2px; }
.chaves { display: grid; grid-template-columns: 1fr; gap: 0; margin: 0 0 8px; }
.chaves dt { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.chaves dd { margin: 0; font-weight: 600; }
.consulta-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.req { font-size: .84rem; margin: 0; }
.req:empty { display: none; }

/* Relógio */
.relogio { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.rl-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--teal); color: var(--surface); display: grid; place-items: center; }
.rl-ic .ic { width: 1.3rem; height: 1.3rem; vertical-align: 0; }
.rl-corpo b { display: block; font-family: var(--serif); font-size: 1.25rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rl-corpo small { display: block; font-size: .8rem; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.rl-trilha { grid-column: 1 / -1; height: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.rl-trilha i { display: block; height: 100%; width: 0; background: var(--teal); }

/* Pergunta no relatório */
.pergunta-res .rot { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px; }
.pergunta-res .citacao { border-left: 4px solid var(--teal); background: var(--teal-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; font-family: var(--serif); font-size: 1.08rem; margin: 0 0 10px; }
.pergunta-res .rot:not(:first-child) { margin-top: 14px; }
.painel h2 { display: flex; align-items: center; gap: 8px; }
.painel h2 .ic { color: var(--teal); }
.progresso-temp { margin-bottom: 8px; }

@media (max-width: 560px) {
  .rel-linha { grid-template-columns: 38px 1fr; }
  .rel-valor { grid-column: 2; text-align: left; display: flex; align-items: baseline; gap: 6px; }
  .rel-valor b { font-size: 1.3rem; }
  .verba-bar { padding: 8px 12px; gap: 10px; }
  .verba-ic { width: 34px; height: 34px; }
  .anel-valor { margin: 0 auto; }
  .problema { padding: 16px; }
}

@media (max-width: 900px) {
  .painel h2 { display: none; }
  body.planner #aviso { bottom: auto; top: 12px; transform: translateX(-50%) translateY(-20px); }
  body.planner #aviso.visivel { transform: translateX(-50%) translateY(0); }
}
@media (max-width: 560px) {
  .voltar { white-space: nowrap; }
  .topo .in { padding: 8px 16px; }
}

/* ---------- Guia de desenhos ---------- */
.dir { display: inline-flex; align-items: center; gap: 18px; }
.guia-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .94rem; text-decoration: none; color: var(--teal); padding: 4px 12px; border: 1.5px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
.guia-link:hover { border-color: var(--teal); background: var(--teal-soft); }
.guia-link .curto { display: none; }
.sub-grupo .ic { color: var(--teal); margin-right: 2px; }
.saiba-lig { margin: 8px 0 0; }
.lig-guia { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 600; }
.pequeno { font-size: .86rem; }

.container.guia { max-width: 860px; }
.guia .hero { padding-top: 28px; }
.guia h2 .ic { color: var(--teal); vertical-align: -.15em; }
.guia h2 { margin-top: 1.4em; }
.guia .hero h1 { margin-top: .1em; }
.trilha { margin: 14px 0 0; font-size: .88rem; color: var(--muted); }
.nota-guia { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }
.nota-guia .ic { margin-top: 3px; color: var(--teal); }

.grupo-guia { margin-top: 28px; }
.grupo-guia > h2 { margin: 0 0 4px; font-size: 1.2rem; }
.grupo-guia > p { margin-bottom: 12px; font-size: .94rem; }
.fam-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.fam-cartao, .chamada-guia { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--ink); text-decoration: none; }
.fam-cartao:hover, .chamada-guia:hover { border-color: var(--teal); background: var(--teal-soft); }
.fam-cartao b, .chamada-guia b { font-family: var(--serif); font-size: 1.04rem; }
.fam-cartao .muted, .chamada-guia .muted { display: inline-block; margin-top: 2px; font-size: .9rem; line-height: 1.35; }
.chamada-guia { margin: 22px 0 8px; align-items: center; }
.chamada-guia > .ic:last-child { margin-left: auto; color: var(--teal); }

.mapa-guia { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.arv, .arv ul { list-style: none; padding-left: 0; margin: 0; }
.arv ul { margin: 4px 0 4px 8px; padding-left: 16px; border-left: 2px solid var(--line); }
.arv li { margin: 6px 0; }
.arv li > b:first-child { font-family: var(--serif); }
.mapa-guia > p { margin: 10px 0 0; }
.mapa-secao { margin-top: 22px; }
.det-corpo .mapa-guia { background: none; border: 0; padding: 4px 0 0; }

.mais-guia { margin-top: 32px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.mais-guia > h2 { margin: 0 0 4px; }
.det-corpo { padding-bottom: 4px; }
.det-corpo h3 { margin: 14px 0 6px; }
.det-corpo ul { margin-top: 0; }
.tabela-wrap { overflow-x: auto; margin: 6px 0 10px; -webkit-overflow-scrolling: touch; }
.tabela-wrap table.cheia { min-width: 540px; font-size: .9rem; }
.vieses { margin: 0 0 8px; }
.vieses dt { font-weight: 600; margin-top: 10px; }
.vieses dd { margin: 2px 0 0; }
.refs, .diretrizes { margin: 6px 0; padding-left: 1.2em; font-size: .92rem; overflow-wrap: anywhere; }
.refs li, .diretrizes li { margin-bottom: 8px; }

.diagrama { margin: 18px 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.diagrama figcaption { margin-top: 6px; font-size: .84rem; color: var(--muted); text-align: center; }
svg.dg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
svg.dg .lin { stroke: var(--ink); stroke-width: 1.6; fill: none; }
svg.dg .lin.g { stroke: var(--muted); stroke-width: 1.3; }
svg.dg .lin.a { stroke: var(--teal); }
svg.dg .lin.b { stroke: var(--amber-bar); }
svg.dg .lin.w { stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
svg.dg .pta { fill: var(--ink); }
svg.dg .f-a { fill: var(--teal); }
svg.dg .f-b { fill: var(--amber-bar); }
svg.dg .f-r { fill: var(--red-bar); }
svg.dg .f-m { fill: var(--surface-2); stroke: var(--line); }
svg.dg .f-a.soft, svg.dg .f-b.soft { fill-opacity: .3; stroke: none; }
svg.dg .s-m { fill: var(--surface); stroke: var(--muted); stroke-width: 1.6; }
svg.dg .box { fill: var(--surface); stroke: var(--muted); stroke-width: 1.4; }
svg.dg .box.a { fill: var(--teal-soft); stroke: var(--teal); }
svg.dg .box.b { fill: var(--amber-soft); stroke: var(--amber-bar); }
svg.dg .tx { font: 600 11.5px var(--sans); fill: var(--ink); }
svg.dg .tx.tm { font-weight: 400; font-size: 10.5px; fill: var(--muted); }
svg.dg .tx.ev { font-weight: 500; font-size: 10.5px; fill: var(--red); }
svg.dg .tx.ta { fill: var(--teal); }
svg.dg .tx.tb { fill: var(--amber); }

.duas-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.ficha-mini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.ficha-mini h3 { margin: 0 0 8px; font-size: 1rem; }
.mais-lista, .menos-lista { list-style: none; margin: 0; padding: 0; }
.mais-lista li, .menos-lista li { position: relative; padding-left: 20px; margin-bottom: 7px; font-size: .94rem; }
.mais-lista li::before, .menos-lista li::before { position: absolute; left: 0; font-weight: 700; }
.mais-lista li::before { content: "+"; color: var(--green); }
.menos-lista li::before { content: "\2212"; color: var(--red); }
.exemplo { border-left: 4px solid var(--amber-bar); background: var(--amber-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 14px 0; }
.exemplo .sobrescrito { color: var(--amber); margin-bottom: 2px; }
.exemplo p:last-child { margin: 0; }
.detalhes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 14px; }

.adeq { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 99px; padding: 1px 10px; white-space: nowrap; }
.adeq.ok { background: var(--green-soft); color: var(--green); }
.adeq.meio { background: var(--amber-soft); color: var(--amber); }
.adeq.pouco { background: var(--red-soft); color: var(--red); }
.adeq.nao { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.onde { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
.onde li { display: flex; gap: 12px; align-items: flex-start; font-size: .94rem; }
.onde .adeq { flex: none; min-width: 8.6em; text-align: center; margin-top: 2px; }

.ant-prox { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.ant-prox a { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

.nao-aplica ul { padding-left: 1.1em; margin: 8px 0 0; }
.nao-aplica li { margin-bottom: 8px; font-size: .92rem; }
.escolha.sua { border-left: 4px solid var(--green-bar); padding-left: 12px; background: var(--green-soft); border-radius: 0 8px 8px 0; margin: 4px 0; }
.ficha-lit .rot { color: var(--teal); }

@media (max-width: 560px) {
  .topo .in .dir .marca { display: none; }
  .guia-link .longo { display: none; }
  .guia-link .curto { display: inline; }
  .duas-col { grid-template-columns: 1fr; }
  .onde li { flex-direction: column; gap: 4px; }
  .fam-grade { grid-template-columns: 1fr; }
  .diagrama { padding: 10px; }
}
@media print {
  .guia-link { display: none !important; }
}

/* A pergunta escolhida muda o desenho ideal e o erro tolerado */
.pq-info:empty { display: none; }
.pq-info { margin-top: 12px; padding: 10px 14px; border-left: 4px solid var(--teal); background: var(--teal-soft); border-radius: 0 10px 10px 0; font-size: .95rem; }
.pq-info p { margin: 0; }
.por-pergunta { display: grid; gap: 4px; margin-top: 6px; font-size: .9rem; }
.por-pergunta > span { display: block; }
.onde .por-pergunta .adeq { min-width: 0; margin: 0 6px 0 0; }
.para-pergunta { font-size: .92rem; color: var(--muted); margin: 0 0 .6em; }

/* Celular: alvos de toque maiores (fica no fim para vencer as regras base) */
@media (max-width: 560px) {
  .saber { width: 34px; height: 34px; top: 8px; right: 8px; }
  .saber::after { content: ""; position: absolute; inset: -6px; }
  details.leia > summary { padding: 10px 0; }
  details.mini summary { padding: 9px 0; }
  .lig-guia { padding: 9px 0; }
  .btn.pequeno { padding: 10px 12px; }
  .consulta-acoes .btn { width: 100%; }
}
@media (max-width: 560px) {
  .retrato ul { grid-template-columns: 1fr 1fr; gap: 8px; }
  .retrato li { flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 12px; }
  .retrato li b { font-size: 1.2rem; }
  .elenco li { padding: 10px 12px; }
}

  { id: "economia", nome: "Economia que responde", desc: "Nota 85 ou mais gastando menos da metade do que um estudo desse tipo costuma custar.", ok: function (S, R) { var f = S.faixa; return R.notas.geral >= 85 && !!f && R.custo.total <= 0.5 * (f[0] + f[1]) / 2; } },
  { id: "ecologico", nome: "Barato na hora certa", desc: "Usou um estudo ecológico ou dados de rotina em uma pergunta que esse desenho responde bem, com nota 80 ou mais.", ok: function (S, R) { return (R.D.fam === "eco" || R.D.fam === "rotina") && R.fit >= 0.85 && R.notas.geral >= 80; } },
  { id: "chefia", nome: "Epidemiologista sênior", desc: "Nota 88 ou mais em um estudo.", ok: function (S, R) { return R.notas.geral >= 88; } },
  { id: "prioridades", nome: "Prioridades certas", desc: "Concluiu com nota 72 ou mais os dois problemas de maior peso para a gestão.", ok: function () {
    var topo = SDE.CENARIOS.slice().sort(function (a, b) { return b.peso - a.peso; }).slice(0, 2);
    return topo.every(function (X) { var f = memo.temporada.feitos[X.id]; return f && f.nota >= 72; });
  } },
  { id: "rodada", nome: "Temporada completa", desc: "Nota 72 ou mais nos cinco estudos, em qualquer tentativa.", ok: function () { return SDE.CENARIOS.every(function (X) { return (memo.melhores[X.id] || 0) >= 72; }); } }
];
function totalMedalhas() { return MEDALHAS.filter(function (m) { return memo.medalhas[m.id]; }).length; }
function conquistar(S, R, ant) {
  var ganhas = [], novas = [];
  MEDALHAS.forEach(function (m) {
    if (m.ok(R.S || S, R, ant)) { ganhas.push(m.id); if (!memo.medalhas[m.id]) { memo.medalhas[m.id] = true; novas.push(m.id); } }

/* ---------- Roteamento por hash ---------- */
function irPara(h) { if (location.hash === h) rotear(); else location.hash = h; }

function iniciarEstudo(id) {
  var S = SDE.achar_cenario(id);
  estado.cid = id; estado.plano = planoInicial(S); estado.esc = novoEsc(); estado.pq = null;
  estado.res = null; estado.sorteio = 0; novaRodada();
}

// Para onde o botão de voltar do Guia leva, e onde a rolagem estava
function voltaDe(view) {
  var y = window.scrollY;
  if (view === "planner" && estado.cid) return { view: view, href: "#/estudo/" + estado.cid, rotulo: "Voltar ao estudo", y: y };
  if (view === "resultado" && estado.cid) return { view: view, href: "#/resultado/" + estado.cid, rotulo: "Voltar ao relatório", y: y };
  return { view: "home", href: "#/", rotulo: "Mesa de prioridades", y: view === "home" ? y : 0 };
}

function rotear() {
  var partes = location.hash.replace(/^#\/?/, "").split("/");
  var rota = partes[0] === "cenario" ? "estudo" : partes[0], id = partes[1];
  var antes = estado.view, retorno = null;
  if (antes === "guia" && rota !== "guia" && estado.guiaVolta) retorno = estado.guiaVolta;
  if (rota === "guia") {
    if (antes !== "guia") estado.guiaVolta = voltaDe(antes);
    estado.guiaId = SDE.GUIA.familia(id) ? id : null;
    estado.view = "guia";
  } else if (rota === "estudo" && SDE.achar_cenario(id)) {
    if (memo.temporada.encerrada) { estado.avisoPendente = "A temporada já foi encerrada. Comece outra para fazer novos estudos."; location.replace("#/"); return; }
    if (!(aloc(id) > 0)) { estado.avisoPendente = "Defina a verba deste estudo na mesa de prioridades."; location.replace("#/"); return; }
    if (estado.cid !== id) iniciarEstudo(id);
    estado.view = "planner";
  } else if (rota === "resultado" && SDE.achar_cenario(id)) {
    if (estado.cid === id && estado.res) estado.view = "resultado";
    else { location.replace("#/estudo/" + id); return; }
  } else {
    estado.view = "home";
  }
  render(false);
  // Voltando do Guia para o mesmo lugar de onde saiu: devolve a rolagem
  if (retorno && retorno.view === estado.view && retorno.y > 0) window.scrollTo(0, retorno.y);
}

function render(manterRolagem) {
  var y = window.scrollY;
  document.body.className = estado.view;
  if (estado.relogio) sincRelogio();
  if (estado.view === "home") { app.innerHTML = limpa(htmlHome()); atualizarMesa(); document.title = TITULO; }
  else if (estado.view === "planner") { app.innerHTML = limpa(htmlPlanner(cen(), estado.plano)); atualizarPainel(); atualizarRelogio(); document.title = cen().titulo + " | " + TITULO; }
  else if (estado.view === "guia") {
    app.innerHTML = limpa(htmlGuia(estado.guiaId));
    var fam = estado.guiaId ? SDE.GUIA.familia(estado.guiaId) : null;
    document.title = (fam ? fam.nome + " | " : "") + "Guia de desenhos | " + TITULO;
  }
  else { app.innerHTML = limpa(htmlResultado(cen(), estado.res)); document.title = "Relatório | " + cen().titulo; }
  if (manterRolagem) window.scrollTo(0, y);
  else { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
  if (estado.avisoPendente) { var m = estado.avisoPendente; estado.avisoPendente = null; aviso(m); }
}

/* Simulador de Desenho de Estudo: mesa de prioridades (início), verba do ano e relatório da temporada */

function moedaCurta(v) {
  if (v >= 1000000) return "R$ " + N(v / 1000000, v % 1000000 === 0 ? 0 : 2) + " mi";
  return "R$ " + N(Math.round(v / 1000)) + " mil";
}

/* ---------- Teto da temporada (cálculo com os planos de referência) ----------
   Cada problema oferece a pergunta principal e as perguntas com plano de referência. A melhor combinação escolhe,
   para cada problema, a pergunta que cabe na verba e entrega mais valor, ou deixa o problema de fora. */
var tetoCache = null;
function opcoesTeto(S) {
  var certa = certaPergunta(S), ops = [{ pergunta: certa, plano: S.referencia }];
  S.perguntas.forEach(function (q) { if (q.referencia) ops.push({ pergunta: q, plano: q.referencia }); });
  return ops.map(function (o) {
    var R = SDE.calcular(S, o.plano, { orcamento: S.orcamento, pergunta: o.pergunta, dias: 45 });
    return { id: S.id, q: o.pergunta.id, custo: R.custo.total, valor: S.peso * R.notas.geral / 100 };
  });
}
function tetoTemporada() {
  if (tetoCache) return tetoCache;
  var listas = SDE.CENARIOS.map(opcoesTeto);
  var melhor = { valor: 0, ids: [], custo: 0, escolhas: {} };
  (function busca(i, custo, valor, ids, esc) {
    if (custo > TER.verba) return;
    if (i === listas.length) {
      if (valor > melhor.valor) melhor = { valor: valor, ids: ids.slice(), custo: custo, escolhas: Object.assign({}, esc) };
      return;
    }
    busca(i + 1, custo, valor, ids, esc);
    listas[i].forEach(function (o) {
      var novo = Object.assign({}, esc); novo[o.id] = o.q;
      busca(i + 1, custo + o.custo, valor + o.valor, ids.concat(o.id), novo);
    });
  })(0, 0, 0, [], {});
  tetoCache = melhor;
  return melhor;
}

/* ---------- Valor entregue ---------- */
function valorTemporada() {
  var t = { valor: 0, gasto: 0, aloc: 0, feitos: 0 };
  SDE.CENARIOS.forEach(function (S) {
    var f = feito(S.id);
    if (aloc(S.id)) t.aloc += aloc(S.id);
    if (f) { t.valor += S.peso * f.nota / 100; t.gasto += f.gasto; t.feitos += 1; }
  });
  return t;
}

function veredictoTemporada(valor, teto, feitos) {
  var r = teto > 0 ? valor / teto : 0;
  if (r >= 0.9) return { n: 5, nome: "Verba bem empregada" };
  if (r >= 0.7) return { n: 4, nome: "Boa gestão da pesquisa" };
  if (r >= 0.5) return { n: 3, nome: "Temporada razoável" };
  if (r >= 0.25) return { n: 2, nome: feitos < 3 ? "Poucos estudos saíram do papel" : "Estudos com pouca utilidade para a gestão" };
  return { n: 1, nome: "Temporada para aprender" };
}

      : a > 0 ? "Você reservou " + MO(a) + ", mas o estudo não saiu do papel e a verba voltou para o caixa da CAP." : "Este problema ficou sem estudo. A decisão sobre " + minusc(S.decisao.replace(/\.$/, "")) + " seguiu sem dado novo.";
    return '<li class="rel-linha ' + cls + '"><span class="rel-ic">' + ic(S.icone) + '</span><div class="rel-corpo"><h3>' + esc(S.titulo) + ' <span class="rot">' + estadoTxt + "</span></h3><p>" + esc(corpo) + '</p></div><div class="rel-valor" aria-label="Valor entregue à gestão"><b>' + N(v, 1) + '</b><small>de ' + N(S.peso) + "</small></div></li>";

    '<p>Cada problema vale um peso para a gestão, e cada estudo entrega esse peso multiplicado pela nota que você tirou. Os pesos ficaram escondidos até agora para você ter de julgar a importância de cada problema pelas pistas do território.</p><p class="muted" style="margin:0">' + esc(dica) + "</p></div></div>" +

    '<p class="rodape">Os personagens, o território, os cenários e todos os números são fictícios e foram criados para treino em grupo. Os modelos são simplificados e não substituem o planejamento de um estudo real com apoio de bioestatística e do comitê de ética.</p></main>' +
    '<div id="aviso" role="status" aria-live="polite"></div>';
}

/* Atualiza a mesa sem redesenhar: preserva o foco no controle que a pessoa está arrastando. */
function atualizarMesa() {
  var barra = document.getElementById("verba-bar");
  if (!barra) return;
  var total = alocTotal();
  barra.innerHTML = '<span class="verba-ic">' + ic("moeda") + "</span><div class=\"verba-corpo\">" + medidor("Verba do ano usada ou reservada", total, TER.verba, MO) +
    '<p class="muted verba-livre">' + (livre() > 0 ? "Livre para reservar: <b>" + MO(livre()) + "</b>" : "<b>Toda a verba foi reservada.</b> Para reservar mais em um problema, tire de outro.") + "</p></div>";
  SDE.CENARIOS.forEach(function (S) {
    var a = aloc(S.id) || 0, f = feito(S.id);
    var c = document.getElementById("ca-" + S.id), o = document.getElementById("oa-" + S.id), p = document.getElementById("prob-" + S.id);
    if (!c || !o) return;
    c.classList.toggle("indef", !a);
    o.textContent = f ? "Gastou " + MO(f.gasto) : a ? MO(a) : "Sem verba";
    if (p) { p.classList.toggle("financiado", !!a && !f); }
    var go = app.querySelector('[data-par="' + S.id + '"]');
    if (go) go.hidden = !a;
  });
  var enc = document.getElementById("btn-encerrar");
  if (enc) enc.disabled = !Object.keys(memo.temporada.feitos).length;
}

function alocar(id, valor) {
  var outros = alocTotal() - (aloc(id) || 0), maximo = Math.max(0, TER.verba - outros);
  var v = Math.max(0, Math.round(valor / TER.passo) * TER.passo), limitou = false;
  if (v > maximo) { v = Math.floor(maximo / TER.passo) * TER.passo; limitou = true; }
  if (v > 0) memo.temporada.aloc[id] = v; else delete memo.temporada.aloc[id];
  var r = document.getElementById("ra-" + id);
  if (r && Number(r.value) !== v) r.value = v;
  salvar();
  atualizarMesa();
  if (limitou) aviso("Só restam " + MO(maximo) + " livres na verba do ano.");
}

function encerrarTemporada() {
  if (!Object.keys(memo.temporada.feitos).length) return;
  memo.temporada.encerrada = true; salvar(); render(false);
  var el = document.getElementById("relatorio");
  if (el) el.scrollIntoView({ block: "start" });
}

function novaTemporada() {
  memo.temporada = { aloc: {}, feitos: {}, encerrada: false };
  estado.cid = null; estado.res = null;
  salvar(); render(false);
}

/* Simulador de Desenho de Estudo: tela do estudo (pergunta, consultorias, relógio, desenho e painel) */

var DIA_MS = 60000; // 1 minuto de relógio = 1 dia no estudo
var MU = F.moedaUn;
var CONS_ICONE = { universidade: "universidade", piloto: "frasco", amostra: "calculadora", bases: "banco" };

/* ---------- Escolhas: nada vem marcado ---------- */
var FALTA = { pergunta: "a pergunta de pesquisa", desenho: "o desenho", amostragem: "a amostragem", coleta: "a forma de coleta", dados: "quem cuida dos dados e sistemas", n: "o tamanho do estudo", equipe: "a equipe", seg: "o tempo de acompanhamento" };
function novoEsc() { return { pergunta: false, desenho: false, amostragem: false, coleta: false, dados: false, n: false, equipe: false, seg: false }; }
function todoEsc() { var o = novoEsc(); for (var k in o) o[k] = true; return o; }
function planoInicial(S) { var p = SDE.planoPadrao(S, null); p.equipe = meio(S.equipe.min, S.equipe.max, 1); return SDE.normalizarPlano(S, p); }
function faltas(D, need) {
  var ordem = ["pergunta", "desenho", "amostragem", "coleta"];
  if (need) ordem.push("dados");
  ordem.push("n", "equipe");
  if (D && D.seg) ordem.push("seg");
  return ordem.filter(function (k) { return !estado.esc[k]; }).map(function (k) { return FALTA[k]; });
}
function perguntaEscolhida(S) {
  var id = estado.pq, q = null;
  S.perguntas.forEach(function (x) { if (x.id === id) q = x; });
  return q;
}
function certaPergunta(S) { return S.perguntas.filter(function (q) { return q.util >= 100; })[0] || S.perguntas[0]; }

/* ---------- Relógio: 1 minuto = 1 dia ---------- */
function novaRodada() { estado.relogio = { acum: 0, desde: null }; estado.cons = {}; estado.diaVisto = 0; }
function msRelogio() { var r = estado.relogio; return r.acum + (r.desde ? Date.now() - r.desde : 0); }
function diasExatos() { return msRelogio() / DIA_MS; }
function diasInteiros() { return Math.floor(diasExatos() + 1e-9); }
function sincRelogio() {
  var r = estado.relogio, deve = estado.view === "planner" && !document.hidden;
  if (deve && !r.desde) r.desde = Date.now();
  else if (!deve && r.desde) { r.acum += Date.now() - r.desde; r.desde = null; }
}
function avancarAte(dia) {
  var ms = msRelogio(), alvo = dia * DIA_MS;
  if (alvo > ms) estado.relogio.acum += alvo - ms;
}
function tick() {
  if (!estado.relogio) return;
  sincRelogio();
  if (estado.view !== "planner") return;
  atualizarRelogio();
  var d = diasInteiros();
  if (d !== estado.diaVisto) { estado.diaVisto = d; aoMudarDia(); }
}
function aoMudarDia() {
  var chegou = verificarChegadas();
  atualizarRelogio();
  if (chegou.length) { atualizarConsultas(); atualizarDados(); }
  atualizarPainel();
  chegou.forEach(function (nome) { aviso("Chegou a resposta: " + nome + "."); });
}

function htmlRelogio() {
  return '<div class="relogio" id="relogio"><span class="rl-ic">' + ic("relogio") + '</span><div class="rl-corpo"><b id="rl-dia">Dia 0</b><small id="rl-sub"></small></div><span class="rl-trilha" aria-hidden="true"><i id="rl-fill"></i></span></div>';
}
function atualizarRelogio() {
  var el = document.getElementById("rl-dia");
  if (!el || !estado.relogio) return;
  var ex = diasExatos(), d = Math.floor(ex + 1e-9), S = cen();
  el.textContent = "Dia " + N(d);
  var pd = document.getElementById("pb-dia"); if (pd) pd.textContent = "Dia " + N(d);
  var sub = d === 0
    ? "Cada minuto é um dia do prazo. Decidir devagar também custa."
    : fmtDias(d) + " de decisão já saíram dos " + S.prazo + " meses do prazo (" + N(d / 30, 1) + " " + plural(d / 30, "mês", "meses") + ").";
  var s = document.getElementById("rl-sub");
  if (s && s.textContent !== sub) s.textContent = sub;
  var f = document.getElementById("rl-fill");
  if (f) f.style.width = (Math.max(0, ex - d) * 100).toFixed(1) + "%";
}

/* ---------- Consultorias ---------- */
function consultaDe(id) { return estado.cons[id] || null; }
function pilotoPronto() { var c = estado.cons.piloto; return !!(c && c.res); }
function pagoTotal() {
  var t = 0;
  SDE.CONSULTAS.forEach(function (C) { var c = estado.cons[C.id]; if (c) t += c.vezes * C.custo; });
  return t;
}
function ctxConsulta() {
  var ch = estado.esc;
  return { desenho: ch.desenho, amostragem: ch.amostragem, coleta: ch.coleta, piloto: pilotoPronto(), pergunta: ch.pergunta ? perguntaEscolhida(cen()) : null };
}
function requisito(id) {
  var ch = estado.esc;
  if (id === "amostra" && !(ch.pergunta && ch.desenho && ch.amostragem && ch.coleta)) return "Escolha a pergunta, o desenho, a amostragem e a coleta para pedir o cálculo.";
  if (id === "bases" && !ch.desenho) return "Escolha o desenho para o especialista avaliar.";
  return "";
}
function contextoTxt(id) {
  var S = cen(), p = estado.plano, ch = estado.esc;
  var D = SDE.achar(S.desenhos, p.desenho), A = SDE.achar(S.amostragens, p.amostragem), C = SDE.achar(S.coletas, p.coleta);
  if (id === "amostra") return "Calculado para: " + D.nome + " · " + A.nome + " · " + C.nome;
  if (id === "bases") return "Avaliado para: " + D.nome + (ch.coleta ? " · " + C.nome : "");
  if (id === "universidade") return ch.desenho ? "Comentou o desenho: " + D.nome : "Conversa geral, sem desenho definido";
  return "";
}
function pedirConsulta(id, modo) {
  var S = cen(), C = SDE.achar(SDE.CONSULTAS, id);
  var c = estado.cons[id] || (estado.cons[id] = { vezes: 0, res: null, pendente: null, ctx: "" });
  if (c.pendente) return;
  var falta = requisito(id);
  if (falta) { aviso(falta); return; }
  if (modo === "pago") {
    if (pagoTotal() + C.custo > orcamentoEstudo()) { aviso("A verba deste estudo não comporta mais esta consultoria."); return; }
    c.vezes += 1;
  }
  var dias = modo === "pago" ? C.dias : C.diasSozinho, agora = diasExatos();
  c.pendente = { modo: modo, pedido: agora, volta: agora + dias, res: SDE.consultar(S, id, estado.plano, ctxConsulta()), ctx: contextoTxt(id), pq: estado.esc.pergunta ? estado.pq : null };
  atualizarConsultas();
  atualizarPainel();
  aviso((modo === "pago" ? C.quem + " vai responder" : "Você começou a levantar isso por conta própria") + ": volta em " + fmtDias(dias) + ".");
}
function verificarChegadas() {
  var chegou = [], agora = diasExatos();
  SDE.CONSULTAS.forEach(function (C) {
    var c = estado.cons[C.id];
    if (c && c.pendente && agora + 1e-9 >= c.pendente.volta) {
      c.res = c.pendente.res; c.ctx = c.pendente.ctx; c.pq = c.pendente.pq; c.pendente = null;
      chegou.push(C.nome);
    }
  });
  return chegou;
}
function esperarConsulta(id) {
  var c = consultaDe(id);
  if (!c || !c.pendente) return;
  avancarAte(c.pendente.volta);
  estado.diaVisto = diasInteiros();
  aoMudarDia();
}

function htmlResultadoConsulta(r) {
  var chaves = r.chaves.length ? '<dl class="chaves">' + r.chaves.map(function (k) { return "<dt>" + esc(k[0]) + "</dt><dd>" + esc(k[1]) + "</dd>"; }).join("") + "</dl>" : "";
  var out = "", lista = [];
  var fecha = function () { if (lista.length) { out += "<ul>" + lista.join("") + "</ul>"; lista = []; } };
  r.linhas.forEach(function (l) {
    if (l.indexOf("• ") === 0) lista.push("<li>" + esc(l.slice(2)) + "</li>");
    else { fecha(); out += "<p>" + esc(l) + "</p>"; }
  });
  fecha();
  return chaves + out;
}

function htmlCartaoConsulta(C) {
  var c = consultaDe(C.id) || { vezes: 0, res: null, pendente: null }, falta = requisito(C.id);
  var pend = c.pendente, estadoCls = pend ? "pendente" : c.res ? "pronta" : "";

  if (pend) {

    var restam = Math.max(1, Math.ceil(falta_d - 0.02));
    corpo += '<div class="espera"><p>' + ic("ampulheta") + "<span>" + (pend.modo === "pago" ? esc(C.quem) + " está trabalhando nisso." : "Você está levantando isso por conta própria.") + " Volta em cerca de <b>" + fmtDias(restam) + "</b>.</span></p>" +
      '<div class="barra" role="img" aria-label="Andamento da consultoria"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<button type="button" class="btn pequeno" data-acao="esperar" data-id="' + C.id + '">Esperar a resposta (avançar ' + fmtDias(restam) + ")</button></div>";
  }
  if (c.res) {
    corpo += '<div class="resposta"><p class="rot">' + ic("check") + " Resposta de " + esc(C.quem) + (c.ctx ? " · " + esc(c.ctx) : "") + (c.pq && c.pq !== (estado.esc.pergunta ? estado.pq : null) ? " · vale para outra pergunta" : "") + "</p>" + htmlResultadoConsulta(c.res) + "</div>";
  }
  var pagoOk = pagoTotal() + C.custo <= orcamentoEstudo();

    botoes = '<div class="consulta-acoes"><button type="button" class="btn' + (c.res ? "" : " primario") + ' pequeno" data-acao="consultar" data-id="' + C.id + '" data-modo="pago"' + (falta || !pagoOk ? " disabled" : "") + ">" + rot + " · " + MO(C.custo) + " · " + fmtDias(C.dias) + "</button>" +
      '<button type="button" class="btn pequeno" data-acao="consultar" data-id="' + C.id + '" data-modo="sozinho"' + (falta ? " disabled" : "") + ">" + (c.res ? "Refazer sozinho" : "Fazer por conta própria") + " · grátis · " + fmtDias(C.diasSozinho) + "</button></div>" +
      (falta ? '<p class="muted req">' + esc(falta) + "</p>" : !pagoOk ? '<p class="muted req">A verba deste estudo não comporta mais esta consultoria.</p>' : "");
    if (!falta && pagoOk && !c.res) notaReq = '<p class="muted req">' + esc(C.req) + "</p>";
  }
  return '<article class="consulta ' + estadoCls + '" id="cons-' + C.id + '"><header><span class="ic-caixa">' + ic(CONS_ICONE[C.id]) + "</span><div><h3>" + esc(C.nome) + '</h3><p class="muted">' + esc(C.quem) + ", " + esc(C.papel) + "</p></div></header>" + leia("cons-" + C.id, "O que é", "<p>" + esc(C.desc) + "</p>" + notaReq) + corpo + botoes + "</article>";

function htmlPlanner(S, plano) {

function statusMsg(S, R) {

  }
  var p = [];
  if (!R.custo.ok) p.push("A verba do estudo estoura em " + MO(R.custo.total - orc) + ".");
  if (!R.tempo.ok) p.push("O cronograma passa do prazo em " + fmtMeses(R.tempo.total - S.prazo) + ".");
  return { cls: "ruim", txt: p.join(" ") };

function pendentes() { return SDE.CONSULTAS.filter(function (C) { var c = estado.cons[C.id]; return c && c.pendente; }); }

// Resumo de uma linha para a barra do painel no celular
function resumoBarra(custo, orc, meses, prazo) {
  var cm = function (v) { return v > 0 ? moedaCurta(v) : "R$ 0"; };
  var a = document.getElementById("pb-1"), b = document.getElementById("pb-prazo");
  if (a) a.innerHTML = 'Verba <b class="' + (custo > orc + 1e-9 ? "estouro" : "") + '">' + cm(custo) + "</b> de " + cm(orc);
  if (b) b.innerHTML = 'Prazo <b class="' + (meses > prazo + 1e-9 ? "estouro" : "") + '">' + N(meses, 1) + "</b> de " + N(prazo, 0) + " meses";
  var d = document.getElementById("pb-dia"); if (d) d.textContent = "Dia " + N(diasInteiros());
}
function atualizarPainel() {
  var S = cen(), ch = estado.esc, orc = orcamentoEstudo();
  var el = function (id) { return document.getElementById(id); };
  if (!el("m-orc")) return;
  atualizarInfoPergunta();
  var s = el("status"), btn = el("btn-exec"), o = opcoes(), pend = pendentes();
  var nota = pend.length ? " Há " + (pend.length === 1 ? "uma consultoria ainda a caminho" : pend.length + " consultorias ainda a caminho") + ": se lançar agora, você abre mão da resposta." : "";
  if (!ch.desenho) {
    var cc = 0; SDE.CONSULTAS.forEach(function (C) { var c = estado.cons[C.id]; if (c) cc += c.vezes * C.custo; });
    el("m-orc").innerHTML = medidor("Verba do estudo", cc, orc, MO);
    el("m-prazo").innerHTML = medidor("Prazo", o.dias / 30, S.prazo, fmtMeses);
    resumoBarra(cc, orc, o.dias / 30, S.prazo);
    s.className = "status"; s.textContent = "Comece pela pergunta e pelo desenho do estudo.";
    btn.disabled = true;
    el("det").hidden = true;
    return;
  }
  var R = SDE.calcular(S, estado.plano, o);
  estado.plano = R.plano;
  el("det").hidden = false;
  el("m-orc").innerHTML = medidor("Verba do estudo", R.custo.total, orc, MO);
  el("m-prazo").innerHTML = medidor("Prazo", R.tempo.total, S.prazo, fmtMeses);
  resumoBarra(R.custo.total, orc, R.tempo.total, S.prazo);

  if (f.length) { s.className = "status"; s.textContent = "Falta definir " + junta(f) + "."; btn.disabled = true; }
  else { s.className = "status " + st.cls; s.textContent = st.txt + nota; btn.disabled = st.cls === "ruim"; }

// Habilita ou desabilita os botões de consultoria conforme o que já foi escolhido e a verba que resta.
function atualizarRequisitos() {
  SDE.CONSULTAS.forEach(function (C) {
    var c = consultaDe(C.id);
    if (c && c.pendente) return;
    var card = document.getElementById("cons-" + C.id);
    if (!card) return;
    var falta = requisito(C.id), pagoOk = pagoTotal() + C.custo <= orcamentoEstudo();
    var bp = card.querySelector('[data-modo="pago"]'), bs = card.querySelector('[data-modo="sozinho"]');
    if (bp) bp.disabled = !!falta || !pagoOk;
    if (bs) bs.disabled = !!falta;
    var req = card.querySelector(".req");
    if (req) req.textContent = falta || (!pagoOk ? "A verba deste estudo não comporta mais esta consultoria." : (c && c.res ? "" : C.req));

    return dgSvg(id, "Série de medidas com a tendência anterior projetada e uma mudança de nível depois da intervenção", s);
  },
  did: function (id) {
    var s = dgLi(36, 14, 36, 104, "lin") + dgLi(36, 104, 335, 104, "lin");
    s += '<line class="lin g" x1="170" y1="14" x2="170" y2="104" stroke-dasharray="4 4"/>' + dgTx(170, 120, "intervenção", "tm");

    return dgSvg(id, "Dois grupos acompanhados no tempo: a mudança no grupo com intervenção menos a mudança no grupo de comparação", s);
  },
  acur: function (id) {
    var s = dgTx(191, 14, "padrão de referência", "tm") + dgTx(150, 32, "+", "tx") + dgTx(232, 32, "−", "tx");
    s += dgTx(104, 62, "teste +", "tm", "end") + dgTx(104, 96, "teste −", "tm", "end");
    s += dgRe(110, 38, 80, 36, "box a", 4) + dgTx(150, 53, "VP", "tx") + dgTx(150, 66, "acerta", "tm");
    s += dgRe(192, 38, 80, 36, "box b", 4) + dgTx(232, 53, "FP", "tx") + dgTx(232, 66, "alarme falso", "tm");
    s += dgRe(110, 76, 80, 36, "box b", 4) + dgTx(150, 91, "FN", "tx") + dgTx(150, 104, "deixou passar", "tm");

    s += dgTx(180, 124, "sensibilidade = VP ÷ (VP + FN) · especificidade = VN ÷ (VN + FP)", "tm");
    return dgSvg(id, "Tabela dois por dois que cruza o resultado do teste com o padrão de referência", s);
  }
};

/* ---------- Utilidades do guia ---------- */
function ligRef(r) {
  var h = r.doi ? "https://doi.org/" + r.doi : r.url;
  return h ? ' <a href="' + esc(h) + '" target="_blank" rel="noopener">' + (r.doi ? "DOI" : "Página") + "</a>" : "";
}
function listaRefs(ids) {
  return '<ul class="refs">' + ids.map(function (id) { var r = GUIA.REFS[id]; return "<li>" + esc(r.t) + ligRef(r) + "</li>"; }).join("") + "</ul>";
}
function rotuloAdeq(fit) { return fit >= 0.85 ? "Responde bem" : fit >= 0.6 ? "Responde em parte" : "Responde pouco"; }
function classeAdeq(fit) { return fit >= 0.85 ? "ok" : fit >= 0.6 ? "meio" : "pouco"; }
function ligGuia(fam, texto) { return '<a class="lig-guia" href="#/guia/' + esc(fam) + '">' + ic("livro") + " " + esc(texto || "Ver no Guia") + "</a>"; }
function htmlDiretrizes(ids) {
  return '<ul class="diretrizes">' + ids.map(function (id) {
    var d = GUIA.DIRETRIZES[id], r = GUIA.REFS[d.ref];
    return "<li><b>" + esc(d.sigla) + "</b>: " + esc(d.txt) + ligRef(r) + "</li>";
  }).join("") + "</ul>";
}

/* Quais perguntas de um problema o desenho responde bem, em parte ou pouco */
function perguntasPorAdeq(S, d) {
  var r = { bem: [], parte: [], pouco: [] };
  S.perguntas.forEach(function (q) {
    var f = SDE.fitPara(d, q), nome = q.curto || q.texto;
    (f >= 0.85 ? r.bem : f >= 0.6 ? r.parte : r.pouco).push(nome);
  });
  return r;
}
/* Onde a família aparece nos problemas do simulador */
function ondeAparece(fid) {
  var linhas = [];
  SDE.CENARIOS.forEach(function (S) {
    S.desenhos.filter(function (d) { return d.fam === fid; }).forEach(function (d) {
      var r = perguntasPorAdeq(S, d), partes = [];
      if (r.bem.length) partes.push('<span class="adeq ok">Responde bem</span> ' + esc(r.bem.join("; ")));
      if (r.parte.length) partes.push('<span class="adeq meio">Em parte</span> ' + esc(r.parte.join("; ")));
      if (r.pouco.length) partes.push('<span class="adeq pouco">Pouco</span> ' + (r.bem.length || r.parte.length ? (r.pouco.length === 1 ? "a outra pergunta" : "as outras " + r.pouco.length + " perguntas") : "nenhuma das " + r.pouco.length + " perguntas"));
      linhas.push('<li><div><b>' + esc(S.titulo) + "</b><br>" + esc(d.nome) + (d.variante ? " (" + esc(d.variante) + ")" : "") + '<span class="por-pergunta">' + partes.map(function (t) { return "<span>" + t + "</span>"; }).join("") + "</span></div></li>");
    });
  });
  SDE.CENARIOS.forEach(function (S) {
    (S.naoAplica || []).filter(function (x) { return x.fam === fid; }).forEach(function (x) {
      linhas.push('<li><span class="adeq nao">Não se aplica</span><div><b>' + esc(S.titulo) + "</b><br>" + esc(x.motivo) + "</div></li>");
    });
  });
  return linhas.length ? '<ul class="onde">' + linhas.join("") + "</ul>" : "";
}

/* O desenho mais caro nem sempre é o melhor: a pergunta decide */
function htmlCustoPergunta() {
  var tab = '<div class="tabela-wrap"><table class="cheia"><thead><tr><th>Se a pergunta é sobre</th><th>O que costuma bastar</th><th>Custo</th><th>Cuidado</th></tr></thead><tbody>' +
    GUIA.TIPOS.map(function (T) {
      return "<tr><td><b>" + esc(T.nome) + "</b><br><span class=\"muted\">" + esc(T.pergunta) + "</span></td><td>" + esc(T.ideaisTxt) + "</td><td>" + esc(T.custoTxt) + "</td><td>" + esc(T.cuidado) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  return "<p>O desenho certo é o que responde à pergunta com a precisão que a decisão pede. O custo acompanha o rigor só até certo ponto: um ensaio randomizado é o desenho mais forte para medir efeito e, ainda assim, não ajuda quem só precisa saber onde um problema é maior.</p>" +
    "<p>Um estudo ecológico, que compara territórios com dados que o serviço já tem, custa pouco e responde bem a perguntas sobre territórios. Ele falha quando a pergunta é sobre o risco de cada pessoa. A pergunta decide se o desenho barato resolve.</p>" + tab +
    "<p>O erro que se tolera também vem da decisão. Para ordenar territórios, ou ver se um indicador sobe, uma estimativa aproximada basta. Para dimensionar uma fila de reabilitação ou decidir expandir uma tecnologia, a margem é menor.</p>" +
    "<p>Estudos caros se justificam quando a pergunta exige comparar pessoas e controlar confusão, medir o efeito de uma intervenção ou contar o que os sistemas não registram. Entre dois desenhos que respondem igualmente bem, o mais barato libera verba para outra pergunta.</p>" +
    '<p class="muted pequeno">No simulador, a nota inclui a economia: entre desenhos que respondem igualmente bem, o mais barato rende alguns pontos, e a verba que o estudo não gasta volta para o caixa do ano.</p>';
}

    if (g.id !== ultimo) { h += '<p class="sub-grupo">' + ic(g.icone) + " " + esc(g.nome) + "</p>"; ultimo = g.id; }
    h += '<div class="escolha' + (d.id === escolhido ? " sua" : "") + '"><p class="rot">' + esc(f.curto + (d.variante ? " · " + d.variante : "")) + '</p><h3>' + esc(d.nome) +
      (d.id === escolhido ? ' <span class="ficha destaque">seu desenho</span>' : "") + '</h3><p><span class="adeq ' + classeAdeq(fit) + '">' + rotuloAdeq(fit) + (Pq ? " para a sua pergunta" : "") + "</span> " + esc(d.desc) + "</p>" + paraPq + listaPC(d) + "<p>" + ligGuia(d.fam, "Ver no Guia") + "</p></div>";
  });
  var nao = (S.naoAplica || []).map(function (x) { return "<li><b>" + esc(GUIA.familia(x.fam).curto) + "</b>: " + esc(x.motivo) + "</li>"; }).join("");
  if (nao) h += '<details class="mini"><summary>Desenhos que não se aplicavam a este problema</summary><ul>' + nao + "</ul></details>";
  return h;
}

function htmlChamadaGuia() {
