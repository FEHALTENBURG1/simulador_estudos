/* Simulador de Desenho de Estudo: relatório do estudo, ações e eventos */

function corNota(g) { return g >= 88 ? "var(--green-bar)" : g >= 72 ? "var(--teal)" : g >= 50 ? "var(--amber-bar)" : "var(--red-bar)"; }
function classeBarra(v) { return v >= 75 ? "" : v >= 50 ? "aviso" : "estouro"; }

function dimensao(nome, v, texto, icone) {
  return '<div class="dim"><div class="linha"><span>' + (icone ? ic(icone) + " " : "") + nome + "</span><span>" + N(v, 0) + '</span></div><div class="barra ' + classeBarra(v) + '" role="img" aria-label="' + nome + ": " + N(v, 0) + ' de 100"><i style="width:' + v.toFixed(0) + '%"></i></div><p>' + texto + "</p></div>";
}

function fraseApoio(R) {
  var n = R.notas;
  if (n.utilidade < 50) return "O estudo pode até ter sido bem conduzido, mas a pergunta escolhida pouco ajuda a coordenação a decidir. A nota fica limitada por isso.";
  if (n.adequacao < 60) return "O desenho escolhido não responde à pergunta do estudo. A equipe voltou do campo com dados que não servem para decidir.";
  if (n.validade < 50) return "O desenho serve, mas os vieses puxaram o resultado para longe da verdade.";
  if (n.precisao < 50) return "O viés é pequeno, mas o intervalo de confiança ficou largo demais para decidir.";
  if (n.geral >= 88 && n.ajusteEcon >= 2) return "A pergunta serve à decisão, o plano responde a ela com pouco viés e boa precisão, e custou menos do que um estudo desse porte costuma custar.";
  if (n.geral >= 88) return "A pergunta serve à decisão e o plano responde a ela com pouco viés e boa precisão.";
  if (n.ajusteEcon <= -2) return "O plano é razoável, mas custou mais do que um estudo desse porte costuma custar, e isso tirou pontos da nota.";
  return "O plano é razoável. Nas anotações da equipe estão os pontos que ainda dá para melhorar.";
}

/* ---------- Gráficos ---------- */
function fmtTick(S, v) {
  if (S.est.tipo === "logrr") return N(Math.exp(v), 2);
  if (S.est.tipo === "prop") return N(v, 0) + "%";
  return N(v, 0);
}
function eixo(lo, hi, W, L, Rm) { return function (v) { return L + (v - lo) / (hi - lo) * (W - L - Rm); }; }
function marcas(S, lo, hi, x, y, n) {
  var s = "";
  for (var i = 0; i <= n; i++) {
    var v = lo + (hi - lo) * i / n, px = x(v).toFixed(1);
    s += '<line class="g-eixo" x1="' + px + '" x2="' + px + '" y1="' + y + '" y2="' + (y + 5) + '"/><text x="' + px + '" y="' + (y + 20) + '" text-anchor="middle">' + esc(fmtTick(S, v)) + "</text>";
  }
  return s;
}
function limitaX(px, W) { return Math.max(80, Math.min(W - 80, px)); }

function graficoUnico(S, R) {
  var th = R.efeitos.theta, tol = S.est.tol, u = R.unico;
  var lo = Math.min(th - 1.7 * tol, u.ic[0], u.est), hi = Math.max(th + 1.7 * tol, u.ic[1], u.est);
  var pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  var W = 680, H = 150, base = 110, x = eixo(lo, hi, W, 24, 24);
  var desc = "Intervalo de confiança de 95% do seu estudo, de " + F.val(S, u.ic[0]) + " a " + F.val(S, u.ic[1]) + ", com estimativa de " + F.val(S, u.est) + ". O valor verdadeiro é " + F.val(S, th) + ".";
  var s = '<svg class="grafico" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(desc) + '">';
  s += '<rect class="g-faixa" x="' + x(th - tol).toFixed(1) + '" y="28" width="' + (x(th + tol) - x(th - tol)).toFixed(1) + '" height="' + (base - 28) + '" rx="4"/>';
  s += '<line class="g-eixo" x1="24" x2="' + (W - 24) + '" y1="' + base + '" y2="' + base + '"/>';
  s += marcas(S, lo, hi, x, base, 4);
  s += '<line class="g-verdade" x1="' + x(th).toFixed(1) + '" x2="' + x(th).toFixed(1) + '" y1="20" y2="' + base + '"/>';
  s += '<text class="forte" x="' + limitaX(x(th), W).toFixed(1) + '" y="13" text-anchor="middle">Verdade: ' + esc(F.val(S, th)) + "</text>";
  s += '<line class="g-ic" x1="' + x(u.ic[0]).toFixed(1) + '" x2="' + x(u.ic[1]).toFixed(1) + '" y1="70" y2="70"/>';
  s += '<line class="g-ic" x1="' + x(u.ic[0]).toFixed(1) + '" x2="' + x(u.ic[0]).toFixed(1) + '" y1="62" y2="78"/>';
  s += '<line class="g-ic" x1="' + x(u.ic[1]).toFixed(1) + '" x2="' + x(u.ic[1]).toFixed(1) + '" y1="62" y2="78"/>';
  s += '<circle class="g-pt" cx="' + x(u.est).toFixed(1) + '" cy="70" r="7"/>';
  s += '<text class="forte" x="' + limitaX(x(u.est), W).toFixed(1) + '" y="54" text-anchor="middle">Seu estudo: ' + esc(F.val(S, u.est)) + "</text>";
  return s + "</svg>";
}

function graficoHist(S, R) {
  var h = R.hist, th = R.efeitos.theta, tol = S.est.tol;
  var W = 680, H = 215, base = 172, x = eixo(h.lo, h.hi, W, 24, 24);
  var max = Math.max.apply(null, h.cont) || 1;
  var desc = "Distribuição de mil repetições do estudo. A média das estimativas é " + F.val(S, h.media) + " e o valor verdadeiro é " + F.val(S, th) + ".";
  var s = '<svg class="grafico" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(desc) + '">';
  s += '<rect class="g-faixa" x="' + x(th - tol).toFixed(1) + '" y="26" width="' + (x(th + tol) - x(th - tol)).toFixed(1) + '" height="' + (base - 26) + '" rx="4"/>';
  h.cont.forEach(function (c, i) {
    var bx = x(h.lo + i * h.w), bw = x(h.lo + (i + 1) * h.w) - bx - 1, bh = c / max * (base - 44);
    if (c > 0) s += '<rect class="g-barra" x="' + bx.toFixed(1) + '" y="' + (base - bh).toFixed(1) + '" width="' + Math.max(bw, 1).toFixed(1) + '" height="' + bh.toFixed(1) + '"/>';
  });
  s += '<line class="g-eixo" x1="24" x2="' + (W - 24) + '" y1="' + base + '" y2="' + base + '"/>';
  s += marcas(S, h.lo, h.hi, x, base, 4);
  s += '<line class="g-media" x1="' + x(h.media).toFixed(1) + '" x2="' + x(h.media).toFixed(1) + '" y1="26" y2="' + base + '"/>';
  s += '<line class="g-verdade" x1="' + x(th).toFixed(1) + '" x2="' + x(th).toFixed(1) + '" y1="20" y2="' + base + '"/>';
  s += '<text class="forte" x="' + limitaX(x(th), W).toFixed(1) + '" y="13" text-anchor="middle">Verdade: ' + esc(F.val(S, th)) + "</text>";
  return s + "</svg>";
}

  var disc = S.discussao.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
  var legenda1 = '<div class="legenda"><span><i style="background:var(--teal-soft);border:1px solid var(--teal)"></i>Faixa de tolerância</span><span><i style="border-top:2px dashed var(--ink);height:0"></i>Verdade</span><span><i style="background:var(--teal);height:4px"></i>IC de 95% do seu estudo</span></div>';
  var legenda2 = '<div class="legenda"><span><i style="background:var(--teal-soft);border:1px solid var(--teal)"></i>Faixa de tolerância</span><span><i style="border-top:2px dashed var(--ink);height:0"></i>Verdade</span><span><i style="background:var(--amber-bar);height:4px"></i>Média das 1.000 repetições</span></div>';
  var orc = R.extra.orcamento;

  return htmlTopo(true) +
    '<main class="container resultado"><section class="res-cab"><p class="sobrescrito"><span class="icone-prob mini">' + ic(S.icone) + "</span> Problema " + S.ordem + " · " + esc(S.area) + "</p><h1>Relatório do estudo</h1><p class=\"muted\">" + esc(S.titulo) + "</p></section>" +
    '<section class="placar">' + anel + '<div class="texto"><p class="estrelas" role="img" aria-label="' + pt.p.n + ' de 5 estrelas">' + estrelas(pt.p.n) + '</p><p class="veredito">' + esc(pt.p.nome) + '</p><p class="muted" style="margin:0 0 6px">' + esc(n.rotulo) + "</p><p>" + esc(fraseApoio(R)) + "</p>" + faltam + avisoMedalhas +
    '<p class="muted" style="margin:0">Verba usada: ' + MO(R.custo.total) + " de " + MO(orc) + " · " + fmtMeses(R.tempo.total) + " de " + S.prazo + " meses" + (melhor != null ? " · Melhor nota neste estudo: " + N(melhor) : "") + "</p></div></section>" +
    '<section class="desfecho"><p class="sobrescrito">' + ic("estrela") + " O que aconteceu depois</p><p>" + esc(S.desfecho[banda]) + "</p></section>" +

    '<div class="dimensoes">' +
    dimensao("Utilidade da pergunta", n.utilidade, "O quanto a pergunta escolhida ajuda a coordenação a decidir.", "pergunta") +
    dimensao("Adequação do desenho", n.adequacao, "O quanto o desenho responde à pergunta feita.", "desenho") +
    dimensao("Validade", n.validade, "Quanto os vieses estimados afastam o resultado da verdade.", "alvo") +
    dimensao("Precisão", n.precisao, "Largura do intervalo de confiança em relação à tolerância.", "lupa") +
    dimensao("Execução", n.execucao, "Respostas, perdas e folga de verba e prazo.", "prancheta") +
    dimensao("Economia", n.economia, textoEconomia(R), "moeda") + "</div>" +

    htmlPerguntaRes(S, R) +

    '<section class="secao"><h2>O que a equipe trouxe do campo</h2><div class="cartao-solto">' +
    "<p>Nesta amostra, a equipe estimou <b>" + esc(F.val(S, u.est)) + "</b> (IC de 95%: " + esc(F.val(S, u.ic[0])) + " a " + esc(F.val(S, u.ic[1])) + "). O valor verdadeiro era <b>" + esc(F.val(S, E.theta)) + "</b>. " + contem + "</p>" +
    graficoUnico(S, R) + legenda1 +
    '<p class="aviso-sorteio" style="margin-top:12px">Uma amostra sozinha varia por acaso, mesmo em um bom estudo. O gráfico seguinte mostra o que aconteceria se o estudo fosse repetido mil vezes.</p>' +
    '<button type="button" class="btn pequeno" data-acao="sortear">' + ic("recomecar") + " Mandar a equipe a campo de novo</button></div></section>" +

    '<section class="secao"><h2>E se o estudo fosse repetido mil vezes?</h2><div class="cartao-solto">' +
    "<p>A média das estimativas seria <b>" + esc(F.val(S, R.hist.media)) + "</b>, contra um valor verdadeiro de <b>" + esc(F.val(S, E.theta)) + "</b>. A distância entre as duas é o viés do plano. A largura da nuvem de resultados é a imprecisão.</p>" +
    graficoHist(S, R) + legenda2 + tiles + "</div></section>" +

    '<section class="secao"><h2>Anotações da equipe sobre o plano</h2><div class="cartao-solto">' + achados + "</div></section>" +

    htmlEscolhas(S, R) +
    '<section class="secao"><h2>Contas do estudo</h2><div class="dupla"><div class="cartao-solto">' + tabelaCusto(R) + '</div><div class="cartao-solto">' + tabelaPrazo(R) + "</div></div></section>" +

    '<section class="secao"><h2>O que ficou no caderno de campo</h2><p>' + esc(S.licao) + "</p>" + htmlReferencia(S, R.pergunta) + "</section>" +
    '<section class="secao discussao"><h2>Para levar à roda de conversa</h2><ol>' + disc + "</ol></section>" +
    htmlMedalhas(rodada) +
    htmlTentativas(S) +
    htmlProgressoTemporada() +
    '<div class="acoes"><button type="button" class="btn primario" data-acao="ajustar">' + ic("recomecar") + " Voltar ao plano e tentar de novo</button>" +
    '<button type="button" class="btn" data-acao="copiar">' + ic("copiar") + " Copiar resumo para o grupo</button>" +
    '<a class="btn" href="#/">' + ic("mapa") + " Mesa de prioridades</a></div>" +
    htmlGlossario() + "</main>" +
    '<div id="aviso" role="status" aria-live="polite"></div>';
}

/* ---------- Ações ---------- */
function registrar(S, R) {
  var lista = memo.tentativas[S.id] || (memo.tentativas[S.id] = []);
  var seq = lista.length ? lista[lista.length - 1].seq + 1 : 1;
  lista.push({ seq: seq, desenho: R.D.nome, tam: R.plano.n, custo: R.custo.total, nota: R.notas.geral, plano: R.plano, pq: estado.pq });
  if (lista.length > 10) lista.shift();
  var ant = memo.melhores[S.id];
  if (ant == null || R.notas.geral > ant) memo.melhores[S.id] = Math.round(R.notas.geral);
  memo.temporada.feitos[S.id] = { nota: Math.round(R.notas.geral), util: Math.round(R.notas.utilidade), gasto: R.custo.total, aloc: R.extra.orcamento, dias: R.extra.dias, pq: R.pergunta ? R.pergunta.id : null, curto: R.pergunta ? R.pergunta.curto : "" };
  salvar();
}

function executar() {
  var S = cen(), o = opcoes(), R = SDE.executar(S, estado.plano, estado.sorteio, o);
  if (!R.custo.ok || !R.tempo.ok || faltas(R.D, R.need).length) return;
  var lista = memo.tentativas[S.id], ant = lista && lista.length ? lista[lista.length - 1].nota : null;
  estado.res = R; estado.opRes = o;
  registrar(S, R);
  estado.rodada = conquistar(S, R, ant);
  irPara("#/resultado/" + S.id);
}

function copiar(txt) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise(function (ok, falha) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy") ? ok() : falha(); } catch (e) { falha(e); }
    document.body.removeChild(ta);
  });
}

function reabrirComPlano(S, plano, pq) {
  estado.plano = SDE.normalizarPlano(S, plano);
  estado.esc = todoEsc();
  estado.pq = pq || null;
  estado.esc.pergunta = !!pq;
  novaRodada();
  irPara("#/estudo/" + S.id);
}

app.addEventListener("click", function (e) {
  var el = e.target.closest("[data-acao]");
  if (!el || el.disabled) return;
  var a = el.getAttribute("data-acao"), S = estado.cid ? cen() : null;
  if (a === "executar") executar();
  else if (a === "reiniciar") { estado.plano = planoInicial(S); estado.esc = novoEsc(); estado.pq = null; render(true); aviso("Plano zerado. As consultorias que você já fez continuam valendo."); }
  else if (a === "saber") {
    var alvo = document.getElementById(el.getAttribute("aria-controls")), abre = alvo.hidden;
    alvo.hidden = !abre; el.setAttribute("aria-expanded", abre ? "true" : "false"); el.classList.toggle("aberto", abre);
  }
  else if (a === "painel") {
    estado.painelAberto = !estado.painelAberto;
    var pn = el.closest(".painel"); if (pn) pn.classList.toggle("aberto", estado.painelAberto);
    el.setAttribute("aria-expanded", estado.painelAberto ? "true" : "false");
  }
  else if (a === "ajustar") { novaRodada(); irPara("#/estudo/" + S.id); }
  else if (a === "sortear") { estado.sorteio += 1; estado.res = SDE.executar(S, estado.plano, estado.sorteio, estado.opRes || opcoes()); render(true); }
  else if (a === "usar-ref") { var rf = referenciaDe(S, estado.res && estado.res.pergunta); reabrirComPlano(S, rf.plano, rf.pergunta.id); }
  else if (a === "restaurar") {
    var t = (memo.tentativas[S.id] || [])[Number(el.getAttribute("data-i"))];
    if (t) reabrirComPlano(S, t.plano, t.pq);
  }
  else if (a === "copiar") {
    copiar(limpa(SDE.resumoTexto(S, estado.res) + "\nPatente: " + patente(estado.res.notas.geral).p.nome)).then(function () { aviso("Resumo copiado."); }, function () { aviso("Não foi possível copiar. Selecione o texto manualmente."); });
  }
  else if (a === "consultar") pedirConsulta(el.getAttribute("data-id"), el.getAttribute("data-modo"));
  else if (a === "esperar") esperarConsulta(el.getAttribute("data-id"));
  else if (a === "refazer") { iniciarEstudo(el.getAttribute("data-id")); irPara("#/estudo/" + el.getAttribute("data-id")); }
  else if (a === "encerrar") encerrarTemporada();
  else if (a === "nova-temporada") novaTemporada();
});

app.addEventListener("input", function (e) {
  var t = e.target;
  if (!t || t.type !== "range") return;
  var id = t.getAttribute("data-aloc");
  if (estado.view === "home" && id) { alocar(id, Number(t.value)); return; }
  if (estado.view !== "planner") return;
  var campo = t.getAttribute("data-campo");
  var p = Object.assign({}, estado.plano); p[campo] = Number(t.value);
  estado.plano = SDE.normalizarPlano(cen(), p);
  estado.esc[campo] = true;
  atualizarPainel();
});

// Tocar no controle já conta como escolha, mesmo que o valor não mude.
app.addEventListener("pointerdown", function (e) {
  var t = e.target;
  if (estado.view !== "planner" || !t || t.type !== "range") return;
  var campo = t.getAttribute("data-campo");
  if (campo && !estado.esc[campo]) { estado.esc[campo] = true; atualizarPainel(); }
});

app.addEventListener("change", function (e) {
  var t = e.target, campo = t.getAttribute && t.getAttribute("data-campo");
  if (estado.view !== "planner" || !campo || t.type === "range") return;
  var S = cen(), p = Object.assign({}, estado.plano), ch = estado.esc;
  if (campo === "pergunta") { estado.pq = t.value; ch.pergunta = true; atualizarConsultas(); atualizarPainel(); return; }
  if (campo === "desenho") {
    var novo = SDE.planoPadrao(S, t.value), D2 = SDE.achar(S.desenhos, t.value);
    novo.n = meio(D2.n.min, D2.n.max, D2.n.passo);
    if (D2.seg) novo.seg = meio(D2.seg.min, D2.seg.max, D2.seg.passo);
    novo.equipe = estado.plano.equipe; novo.qual = estado.plano.qual;
    estado.plano = SDE.normalizarPlano(S, novo);
    ch.desenho = true; ch.amostragem = false; ch.coleta = false; ch.dados = false; ch.n = false; ch.seg = false;
    render(true);
    var marcado = app.querySelector('input[name="desenho"]:checked');
    if (marcado) marcado.focus({ preventScroll: true });
    return;
  }
  if (campo === "amostragem" || campo === "coleta") {
    var antes = SDE.dadosNecessarios(S, p.desenho, ch.coleta ? p.coleta : null);
    p[campo] = t.value; ch[campo] = true;
    var depois = SDE.dadosNecessarios(S, p.desenho, ch.coleta ? p.coleta : null);
    estado.plano = SDE.normalizarPlano(S, p);
    if ((antes && antes.nivel) !== (depois && depois.nivel) || (antes && antes.titulo) !== (depois && depois.titulo)) {
      ch.dados = false;
      render(true);
      var m2 = app.querySelector('input[name="' + campo + '"]:checked');
      if (m2) m2.focus({ preventScroll: true });
      return;
    }
  }
  else if (campo === "dados") { p.dados = t.value; ch.dados = true; estado.plano = SDE.normalizarPlano(S, p); }
  else if (campo === "qual") { p.qual = Object.assign({}, p.qual); if (t.checked) p.qual[t.value] = true; else delete p.qual[t.value]; estado.plano = SDE.normalizarPlano(S, p); }
  atualizarPainel();
});

document.addEventListener("visibilitychange", function () { if (estado.relogio) sincRelogio(); });
window.addEventListener("hashchange", rotear);

document.body.insertAdjacentHTML("afterbegin", sprite());
carregar();
novaRodada();
rotear();
setInterval(tick, 1000);

})();
</script>
</body>
</html>
